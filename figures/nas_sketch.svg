  <text class="label" x="910" y="88" text-anchor="middle">
    <tspan x="910" dy="0">Performance</tspan>
    <tspan x="910" dy="33">Estimation</tspan>
    <tspan x="910" dy="33">Strategy</tspan>
  </text>

  <line class="line" x1="218" y1="100" x2="346" y2="100" marker-end="url(#arrow-end)"/>

  <path class="line" d="M 587 92 Q 688 30 790 84" marker-end="url(#arrow-end)"/>
  <path class="line" d="M 790 121 Q 688 168 587 121" marker-end="url(#arrow-end)"/>

